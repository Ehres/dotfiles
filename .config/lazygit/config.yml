customCommands:
  - key: "<c-g>"
    context: "files"
    description: "Generate AI commit message"
    command: "opencode run '/gen-commit --auto'"
    output: terminal
    loadingText: "Generating commit message..."
git:
  pagers:
    - colorArg: "always"
      pager: "delta --side-by-side --line-numbers --paging=never"
