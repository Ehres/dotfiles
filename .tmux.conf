set -g mouse on

set-option -g status-position top
set -g base-index 1
set -g renumber-windows on

# ============================================================================
# SENSIBLE DEFAULTS
# ============================================================================
# Inlined from tmux-plugins/tmux-sensible, which was dropped: its last commit is
# from August 2022. Only the settings that actually differed from tmux's own
# defaults are kept -- escape-time and default-terminal are left alone because
# modern tmux already picks 10ms and tmux-256color, which are the values we want.

set -g history-limit 50000        # tmux default is 2000
set -g display-time 4000          # tmux default is 750
set -g status-interval 5          # tmux default is 15
set -g status-keys emacs
set -g focus-events on            # required for Neovim's autoread
setw -g aggressive-resize on

# Bindings tmux-sensible provided and that were in use
bind C-b send-prefix
bind b last-window
bind C-p previous-window
bind C-n next-window

# `r` reloads the config. Note that tmux-powerkit rebinds this later with a
# version that also reloads its theme, and being sourced after this file, it
# wins -- deliberately, since it is a superset.
bind r source-file ~/.tmux.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @plugin 'alberti42/tmux-fzf-links'

# ============================================================================
# PowerKit GLOBAL OPTIONS
# ============================================================================

# Theme
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_theme_variant "night"
set -g @powerkit_transparent "true"

# Plugins
set -g @powerkit_plugins "cpu,memory"

# Separators
set -g @powerkit_separator_style "slantup"
set -g @powerkit_edge_separator_style "rounded:all"
set -g @powerkit_initial_separator_style "rounded"
set -g @powerkit_elements_spacing "false"

# Status bar
set -g @powerkit_bar_layout "single"
set -g @powerkit_status_interval "5"
set -g @powerkit_status_position "top"
set -g @powerkit_status_justify "left"
set -g @powerkit_status_order "session,windows,plugins"

# Keybindings
set -g @powerkit_show_options_key "C-e"
set -g @powerkit_theme_selector_key "C-r"
set -g @powerkit_keybinding_conflict_action "warn"

# ============================================================================
# SESSION OPTIONS
# ============================================================================

set -g @powerkit_session_icon "auto"
set -g @powerkit_session_show_mode "false"
# Still required as of powerkit v7.0.0 -- re-checked, the bug is NOT fixed.
# src/renderer/entities/session.sh:50 defaults the copy *icon* to
# POWERKIT_DEFAULT_SESSION_COPY_MODE_COLOR, which is the string "session-copy-bg"
# (defaults.sh:344) and is legitimately used just below as the copy-mode
# *background*. Line 64 prints icon_copy straight into the tmux format with no
# colour resolution, so unsetting this renders the literal token in copy mode.
# src/contract/session_contract.sh holds the correct default, but compositor.sh
# sources the renderer path. Value below is nf-fa-copy. Worth reporting upstream.
set -g @powerkit_session_copy_icon ""

# ============================================================================
# WINDOW OPTIONS
# ============================================================================

set -g @powerkit_window_index_style "numeric"

# ============================================================================
# PANE OPTIONS
# ============================================================================

# Use unified pane border color
set -g @powerkit_pane_border_unified "true"
set -g @powerkit_pane_border_color "pane-border-active"

# No pane status line on borders
set -g @powerkit_pane_border_status "off"
set -g @powerkit_pane_flash_enabled "true"

# tmux-fzf-links
set-option -g @fzf-links-key C-f
set-option -g @fzf-links-python '/opt/homebrew/bin/python3.12'
set-option -g @fzf-links-editor-open-cmd "tmux popup -E -w 70% -h 70% 'zsh -ic \"nvim +%line \\\"%file\\\"\"'"

# Keybindings for floating panes (Escape passes through to app, Ctrl+q to close)
bind y display-popup -T " yazi (C-q close)" -d '#{pane_current_path}' -h 70% -w 80% -E '~/scripts/tmux-popup --kill yazi yazi'
bind g display-popup -T " lazygit (C-q close)" -w 90% -h 90% -d '#{pane_current_path}' -E '~/scripts/tmux-popup --kill lazygit lazygit'
bind R display-popup -T " tuicr (C-q close)" -w 90% -h 90% -d '#{pane_current_path}' -E '~/scripts/tmux-popup --kill tuicr tuicr -w'
bind m display-popup -T " btop (C-q close)" -w 90% -h 90% '~/scripts/tmux-popup btop btop'
bind t display-popup -T " scratch (C-q close)" -w 80% -h 70% -d '#{pane_current_path}' -E '~/scripts/tmux-popup scratch'
bind d run-shell '~/scripts/tmux-dash-toggle'

# Vim-Tmux-Navigator settings
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

