unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

set-option -g status-position top
set -g base-index 1
set -g renumber-windows on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-urlview'

# Tokyo Night theme settings
set -g @theme_transparent_status_bar 'true'
set -g @theme_disable_plugins 1
set -g @theme_left_separator ''
set -g @theme_right_separator ''
set -g @theme_transparent_left_separator_inverse ' '
set -g @theme_transparent_right_separator_inverse ''

set -g @theme_active_pane_border_style '#7aa2f7'
set -g @theme_inactive_pane_border_style '#3b4261'

# Pane styling
set -g pane-border-lines simple
set -g window-style 'fg=#565f89,bg=default'
set -g window-active-style 'fg=#c0caf5,bg=default'
set -g pane-border-status top
set -g pane-border-format ' #{?pane_active,#[fg=#7aa2f7 bg=default bold],#[fg=#565f89 bg=default]}#P: #{pane_title}#[default] '

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Keybindings for popups
bind y display-popup -d '#{pane_current_path}' -h 70% -w 80% -E 'tmux new-session yazi \; set status off'
bind g display-popup -E -w 90% -h 90% -d '#{pane_current_path}' 'lazygit'
bind m display-popup -E -w 80% -h 80% 'btop'

# Vim-Tmux-Navigator settings
set -g @vim_navigator_mapping_left "C-Left C-h"  # use C-h and C-Left
set -g @vim_navigator_mapping_right "C-Right C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""  # removes the C-\ binding

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# Override pane borders after TPM (plugin only sets fg, we add bg=default for terminal background)
set -g pane-border-style 'fg=#3b4261,bg=default'
set -g pane-active-border-style 'fg=#7aa2f7,bg=default'

# Add left padding to status bar (after TPM to override plugin)
# Reconstructs the plugin's status-left format with rounded separators and a leading space
# Structure: space + (rounded open) + session name + (rounded close)
# Colors: green normally (#9ece6a), yellow when prefix active (#e0af68)
set -g status-left " #{?client_prefix,#[fg=#e0af68 bg=default],#[fg=#9ece6a bg=default]}#{?client_prefix,#[fg=#3b4261 bg=#e0af68 bold],#[fg=#3b4261 bg=#9ece6a bold]}  #{?client_prefix,#[fg=#e0af68 bg=default],#[fg=#9ece6a bg=default]}#[none]"

